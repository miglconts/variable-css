<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
    <style>
      @keyframes bigger {
        0% {
          font-variation-settings: "wght" 100, "wdth" 70;
        }
        50% {
          font-variation-settings: "wght" 900, "wdth" 70;
        }
        100% {
          font-variation-settings: "wght" 100, "wdth" 70;
        }
      }
      p {
        animation: wacky infinite;
        animation-duration: 5s;
        font-family: "Work sans";
        animation-timing-function: ease;
        font-size: 10vh;
        margin: 0vw auto;
        padding: 0;
        line-height: 1;
        font-weight: normal;
      }
      p span {
        animation: bigger infinite;
        animation-duration: 2s;
        animation-timing-function: ease;
        font-variation-settings: "wdth" 70;
      }
      p span:nth-child(2) {
        animation-delay: 0.1s;
      }
      p span:nth-child(3) {
        animation-delay: 0.2s;
      }
      p span:nth-child(4) {
        animation-delay: 0.3s;
      }
      p span:nth-child(5) {
        animation-delay: 0.4s;
      }
      p span:nth-child(6) {
        animation-delay: 0.5s;
      }
      p span:nth-child(7) {
        animation-delay: 0.6s;
      }
      p span:nth-child(8) {
        animation-delay: 0.7s;
      }
      p span:nth-child(9) {
        animation-delay: 0.8s;
      }
      p span:nth-child(10) {
        animation-delay: 0.9s;
      }
      p span:nth-child(11) {
        animation-delay: 1s;
      }
      p span:nth-child(12) {
        animation-delay: 1.1s;
      }
    </style>
  </head>
  <body>
    <p>
      <span>i</span><span>n</span><span>t</span><span>e</span><span>r</span
      ><span>d</span><span>e</span><span>s</span><span>k</span><span>.</span
      ><span>w</span><span>s</span>
    </p>
    <p>
      <span>i</span><span>n</span><span>t</span><span>e</span><span>r</span
      ><span>d</span><span>e</span><span>s</span><span>k</span><span>.</span
      ><span>w</span><span>s</span>
    </p>
    <p>
      <span>i</span><span>n</span><span>t</span><span>e</span><span>r</span
      ><span>d</span><span>e</span><span>s</span><span>k</span><span>.</span
      ><span>w</span><span>s</span>
    </p>
  </body>
</html>
